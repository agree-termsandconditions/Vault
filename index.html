<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes Space</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="description" content="A clean, minimalist, desktop-first web application for sharing encrypted and public study notes, documents, and web links with multi-tag categorization and instant low-latency search." />
    <meta property="og:title" content="Notes Space" />
    <meta property="og:description" content="A clean, minimalist, desktop-first web application for sharing encrypted and public study notes, documents, and web links with multi-tag categorization and instant low-latency search." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Fonts: Plus Jakarta Sans, Space Grotesk, Caveat, Kalam, Noto Sans & JetBrains Mono -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kalam:wght@400;700&family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Prevent native browser tooltip popups from prompting on hover
      document.addEventListener('mouseover', function(e) {
        var el = e.target && e.target.closest ? e.target.closest('[title]') : null;
        if (el) {
          var t = el.getAttribute('title');
          if (t) {
            el.setAttribute('data-title', t);
            el.removeAttribute('title');
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
