services:
  vault:
    build: .
    container_name: campus-study-vault
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=443
      - HTTP_PORT=80
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - vault_data:/app/EncryptedUploads
      - ./certs:/app/certs

volumes:
  vault_data:
