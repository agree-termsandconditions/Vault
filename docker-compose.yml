services:
  vault:
    build: .
    container_name: campus-study-vault
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - vault_data:/app/EncryptedUploads

volumes:
  vault_data:
